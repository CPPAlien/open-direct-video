name: Desktop release
on:
  push:
    tags: ['v[0-9]*']
permissions:
  contents: write
jobs:
  mac-arm64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package
      - name: Sign and zip Apple Silicon app
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
          bundle=release/OpenDirect-darwin-arm64/OpenDirect.app
          zip_name="OpenDirect-${GITHUB_REF_NAME}-mac-arm64.zip"
          codesign --force --deep --sign - "$bundle"
          codesign --verify --deep --strict "$bundle"
          ditto -c -k --sequesterRsrc --keepParent "$bundle" "release/$zip_name"
          cp release/OpenDirect-darwin-arm64/LICENSE release/LICENSE-Electron.txt
          cp release/OpenDirect-darwin-arm64/LICENSES.chromium.html release/LICENSES-Chromium.html
          cp LICENSE release/LICENSE-OpenDirect.txt
          cd release
          zip -gq "$zip_name" LICENSE-Electron.txt LICENSES-Chromium.html LICENSE-OpenDirect.txt
          shasum -a 256 "$zip_name" > SHA256SUMS.txt
          unzip -tq "$zip_name"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "release/OpenDirect-$GITHUB_REF_NAME-mac-arm64.zip" release/SHA256SUMS.txt \
            --verify-tag --title "OpenDirect $GITHUB_REF_NAME" --notes-file docs/release-notes.md
